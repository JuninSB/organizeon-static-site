<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Space Dodge</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#f4f5ff;background:radial-gradient(circle at 50% 10%,#202750,#050611 67%);font-family:system-ui,sans-serif;touch-action:none}.game{text-align:center}h1{margin:0;font-size:clamp(25px,7vw,42px)}p{margin:6px;color:#afb8df}b{color:#84f4e0}canvas{width:min(94vw,520px);height:min(125vw,650px);max-height:68dvh;border:1px solid #879aff55;border-radius:16px;background:#060a1b;box-shadow:0 25px 70px #0009}.controls{display:flex;justify-content:center;gap:12px;margin-top:11px}.controls button{width:120px;height:48px;border:1px solid #8aa0ff55;border-radius:12px;color:#fff;background:#19234c;font-size:22px}</style></head>
<body><main class="game"><h1>Space Dodge</h1><p>Tempo: <b>0.0</b>s · desvie dos meteoros</p><canvas width="520" height="650"></canvas><div class="controls"><button>◀</button><button>▶</button></div></main>
<script>
const c=document.querySelector("canvas"),g=c.getContext("2d"),out=document.querySelector("b");let ship,rocks,start,last,left=0,right=0,stars=[];
function reset(){ship={x:235,y:570};rocks=[];start=performance.now();last=0;stars=Array.from({length:70},()=>({x:Math.random()*520,y:Math.random()*650,s:Math.random()*2+1}))}
function loop(now){const t=(now-start)/1000;if(left)ship.x-=6;if(right)ship.x+=6;ship.x=Math.max(4,Math.min(466,ship.x));if(now-last>Math.max(230,700-t*20)){rocks.push({x:Math.random()*480,y:-35,r:14+Math.random()*20,v:3+Math.random()*3+t*.07});last=now}rocks.forEach(r=>r.y+=r.v);rocks=rocks.filter(r=>r.y<700);if(rocks.some(r=>Math.hypot(r.x+r.r-ship.x-25,r.y+r.r-ship.y-26)<r.r+18)){reset()}out.textContent=((now-start)/1000).toFixed(1);draw();requestAnimationFrame(loop)}
function draw(){g.fillStyle="#060a1b";g.fillRect(0,0,520,650);g.fillStyle="#fff";stars.forEach(s=>{s.y+=s.s*.18;if(s.y>650)s.y=0;g.globalAlpha=s.s/3;g.fillRect(s.x,s.y,s.s,s.s)});g.globalAlpha=1;rocks.forEach(r=>{g.fillStyle="#7e658b";g.beginPath();g.arc(r.x+r.r,r.y+r.r,r.r,0,7);g.fill();g.fillStyle="#4c3c59";g.beginPath();g.arc(r.x+r.r*.7,r.y+r.r*.8,r.r*.25,0,7);g.fill()});g.fillStyle="#71efd6";g.beginPath();g.moveTo(ship.x+25,ship.y);g.lineTo(ship.x+50,ship.y+52);g.lineTo(ship.x+25,ship.y+41);g.lineTo(ship.x,ship.y+52);g.closePath();g.fill();g.fillStyle="#ff9f54";g.fillRect(ship.x+18,ship.y+42,14,18)}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=1;if(e.key==="ArrowRight"||e.key==="d")right=1});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=0;if(e.key==="ArrowRight"||e.key==="d")right=0});c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)*520/r.width-25});const bs=document.querySelectorAll("button");for(const [b,d] of [[bs[0],-1],[bs[1],1]]){b.onpointerdown=()=>d<0?left=1:right=1;b.onpointerup=b.onpointercancel=()=>d<0?left=0:right=0}reset();requestAnimationFrame(loop);
</script></body></html>
