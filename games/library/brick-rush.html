<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Brick Rush</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#eefcff;background:radial-gradient(circle at 30% 10%,#24355f,#070914 65%);font-family:system-ui,sans-serif;touch-action:none}.game{text-align:center}h1{margin:0;font-size:clamp(25px,7vw,42px)}p{margin:6px;color:#aebadb}b{color:#70e6ff}canvas{width:min(94vw,620px);height:min(66vw,420px);max-height:62dvh;border:1px solid #70e6ff55;border-radius:16px;background:#080d1d;box-shadow:0 25px 70px #0009}.controls{display:flex;gap:10px;justify-content:center;margin-top:12px}.controls button{width:110px;height:48px;border:1px solid #7bdfff55;border-radius:12px;color:#eafcff;background:#172d4c;font-size:22px}</style></head>
<body><main class="game"><h1>Brick Rush</h1><p>Pontos: <b>0</b> · ← →, mouse ou toque</p><canvas width="720" height="480"></canvas><div class="controls"><button>◀</button><button>▶</button></div></main>
<script>
const c=document.querySelector("canvas"),g=c.getContext("2d"),out=document.querySelector("b");let px,bx,by,vx,vy,bricks,score,left=0,right=0,run;
function reset(){px=300;bx=360;by=390;vx=4;vy=-4;score=0;out.textContent=0;bricks=[];for(let y=0;y<5;y++)for(let x=0;x<9;x++)bricks.push({x:24+x*76,y:45+y*36,on:1,h:y*38})}
function frame(){if(left)px-=7;if(right)px+=7;px=Math.max(0,Math.min(600,px));bx+=vx;by+=vy;if(bx<9||bx>711)vx*=-1;if(by<8)vy*=-1;if(by>500){reset()}if(by>420&&by<440&&bx>px&&bx<px+120&&vy>0){vy=-Math.abs(vy);vx+=(bx-(px+60))*.025}bricks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+64&&by>b.y&&by<b.y+24){b.on=0;vy*=-1;score++;out.textContent=score}});if(bricks.every(b=>!b.on))reset();draw();run=requestAnimationFrame(frame)}
function draw(){g.clearRect(0,0,c.width,c.height);bricks.forEach(b=>{if(!b.on)return;g.fillStyle=`hsl(${185+b.h} 85% 60%)`;g.shadowColor=g.fillStyle;g.shadowBlur=8;g.fillRect(b.x,b.y,64,24)});g.shadowBlur=0;g.fillStyle="#70e6ff";g.fillRect(px,430,120,15);g.fillStyle="#fff";g.beginPath();g.arc(bx,by,9,0,7);g.fill()}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=1;if(e.key==="ArrowRight"||e.key==="d")right=1});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")left=0;if(e.key==="ArrowRight"||e.key==="d")right=0});c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)*c.width/r.width-60});const bs=document.querySelectorAll("button");for(const [b,d] of [[bs[0],-1],[bs[1],1]]){b.onpointerdown=()=>d<0?left=1:right=1;b.onpointerup=b.onpointercancel=()=>d<0?left=0:right=0}reset();frame();
</script></body></html>
