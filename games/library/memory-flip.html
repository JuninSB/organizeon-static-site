<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Memory Flip</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;color:#fff4fe;background:radial-gradient(circle at 50% 15%,#582456,#110914 67%);font-family:system-ui,sans-serif}.game{width:min(94vw,570px);text-align:center}h1{margin:0;font-size:clamp(27px,8vw,44px)}p{margin:7px;color:#d6afcf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.card{aspect-ratio:1;border:1px solid #ff8bdd55;border-radius:15px;color:transparent;background:linear-gradient(145deg,#612b61,#29152e);font-size:clamp(25px,9vw,50px);box-shadow:0 10px 25px #0005;transition:.18s transform,.18s background}.card.open,.card.done{color:#fff;background:#a33b87;transform:rotateY(180deg)}.card.done{opacity:.55}.restart{margin-top:16px;min-height:44px;padding:0 18px;border:1px solid #ff9de455;border-radius:11px;color:#fff;background:#6c285f;font-weight:700}</style></head>
<body><main class="game"><h1>Memory Flip</h1><p>Jogadas: <b>0</b> · Pares: <span>0/8</span></p><div class="grid"></div><button class="restart">Novo jogo</button></main>
<script>
const icons=["🚀","🍌","🎮","⚡","👾","💎","🔥","🌙"],grid=document.querySelector(".grid"),moves=document.querySelector("b"),pairs=document.querySelector("span");let open=[],locked=0,count=0,found=0;
function start(){const deck=[...icons,...icons].sort(()=>Math.random()-.5);grid.innerHTML="";open=[];locked=count=found=0;moves.textContent=0;pairs.textContent="0/8";deck.forEach((icon,i)=>{const b=document.createElement("button");b.className="card";b.textContent=icon;b.dataset.icon=icon;b.dataset.id=i;b.onclick=()=>flip(b);grid.append(b)})}
function flip(card){if(locked||card.classList.contains("open")||card.classList.contains("done"))return;card.classList.add("open");open.push(card);if(open.length<2)return;count++;moves.textContent=count;if(open[0].dataset.icon===open[1].dataset.icon){open.forEach(x=>{x.classList.remove("open");x.classList.add("done")});open=[];found++;pairs.textContent=found+"/8";if(found===8)setTimeout(()=>alert("Você encontrou todos os pares em "+count+" jogadas!"),200)}else{locked=1;setTimeout(()=>{open.forEach(x=>x.classList.remove("open"));open=[];locked=0},650)}}
document.querySelector(".restart").onclick=start;start();
</script></body></html>
