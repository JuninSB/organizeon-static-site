<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Memory Flip</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;color:#fff4fe;background:radial-gradient(circle at 50% 15%,#582456,#110914 67%);font-family:system-ui,sans-serif}.game{width:min(96vw,760px);padding:14px;text-align:center}h1{margin:0;font-size:clamp(30px,8vw,50px)}p{margin:7px;color:#d6afcf}.settings{display:flex;align-items:center;justify-content:center;gap:9px;margin:12px 0}.settings label{color:#d6afcf;font-size:13px}.settings select{min-height:42px;padding:0 12px;border:1px solid #ff9de455;border-radius:10px;color:#fff;background:#3d1d42;font:600 14px system-ui}.grid{display:grid;grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));gap:clamp(7px,1.6vw,12px);width:min(100%,680px);margin:10px auto 0}.card{min-width:0;aspect-ratio:1;border:1px solid #ff8bdd55;border-radius:15px;color:transparent;background:linear-gradient(145deg,#612b61,#29152e);font-size:clamp(30px,7vw,58px);box-shadow:0 10px 25px #0005;transition:.18s transform,.18s background;user-select:none;-webkit-user-select:none}.card.open,.card.done{color:#fff;background:#a33b87;transform:rotateY(180deg)}.card.done{opacity:.55}.restart{margin-top:14px;min-height:46px;padding:0 20px;border:1px solid #ff9de455;border-radius:11px;color:#fff;background:#6c285f;font-weight:700}@media(max-width:520px){.game{padding:8px}.grid{gap:7px}.card{border-radius:11px}.grid[data-level="hard"]{--columns:4!important}}</style></head>
<body><main class="game"><h1>Memory Flip</h1><p>Jogadas: <b>0</b> · Pares: <span>0/8</span></p><div class="settings"><label for="difficulty">Dificuldade</label><select id="difficulty"><option value="easy">Fácil · 6 pares</option><option value="normal" selected>Normal · 8 pares</option><option value="hard">Difícil · 12 pares</option></select></div><div class="grid"></div><button class="restart">Novo jogo</button></main>
<script>
const icons=["🚀","🍌","🎮","⚡","👾","💎","🔥","🌙","🌈","🍕","🦖","🎯"],levels={easy:{pairs:6,columns:4},normal:{pairs:8,columns:4},hard:{pairs:12,columns:6}},grid=document.querySelector(".grid"),moves=document.querySelector("b"),pairs=document.querySelector("span"),difficulty=document.querySelector("#difficulty");let open=[],locked=0,count=0,found=0,totalPairs=8;
function start(){const level=levels[difficulty.value]||levels.normal;totalPairs=level.pairs;const chosen=icons.slice(0,totalPairs),deck=[...chosen,...chosen].sort(()=>Math.random()-.5);grid.innerHTML="";grid.style.setProperty("--columns",level.columns);grid.dataset.level=difficulty.value;open=[];locked=count=found=0;moves.textContent=0;pairs.textContent=`0/${totalPairs}`;deck.forEach((icon,i)=>{const b=document.createElement("button");b.className="card";b.textContent=icon;b.dataset.icon=icon;b.dataset.id=i;b.onclick=()=>flip(b);grid.append(b)})}
function flip(card){if(locked||card.classList.contains("open")||card.classList.contains("done"))return;card.classList.add("open");open.push(card);if(open.length<2)return;count++;moves.textContent=count;if(open[0].dataset.icon===open[1].dataset.icon){open.forEach(x=>{x.classList.remove("open");x.classList.add("done")});open=[];found++;pairs.textContent=`${found}/${totalPairs}`;if(found===totalPairs)setTimeout(()=>alert("Você encontrou todos os pares em "+count+" jogadas!"),200)}else{locked=1;setTimeout(()=>{open.forEach(x=>x.classList.remove("open"));open=[];locked=0},650)}}
difficulty.onchange=start;document.querySelector(".restart").onclick=start;start();
</script></body></html>
