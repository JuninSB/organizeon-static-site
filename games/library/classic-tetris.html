<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tetris</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#f7f1ff;background:radial-gradient(circle at 50% 5%,#513078,#100a19 72%);font-family:system-ui,sans-serif;touch-action:none;user-select:none}.game{width:min(96vw,520px);text-align:center}.head{display:flex;justify-content:center;align-items:end;gap:20px}.head div{min-width:80px}.head span{display:block;color:#cbb8db;font-size:11px;text-transform:uppercase}.head b{font-size:18px}h1{margin:0;font-size:clamp(28px,8vw,44px)}.stage{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:8px auto}.side{width:76px;padding:7px;border:1px solid #d99cff38;border-radius:10px;background:#170e22}.side small{display:block;margin-bottom:4px;color:#cbb8db}canvas{image-rendering:pixelated}.board{width:min(48vw,200px,50dvh);height:auto;border:2px solid #d99cff66;box-shadow:0 18px 55px #0009;background:#09060d}.preview{width:60px;height:60px}.pad{display:grid;grid-template-columns:repeat(5,minmax(48px,64px));gap:6px;justify-content:center}.pad button{height:45px;border:1px solid #e0b0ff55;border-radius:10px;color:#fff;background:#4c306b;font-size:17px;font-weight:700}.pad .wide{grid-column:span 2;font-size:12px}.help{margin:7px 0 0;color:#bbaaca;font-size:11px}@media(max-width:430px){.side{width:64px}.preview{width:50px;height:50px}.stage{gap:5px}.pad{grid-template-columns:repeat(5,minmax(43px,58px))}}
</style><style id="tetris-mobile-overrides">
body{overflow:auto;padding:14px 8px 22px;touch-action:manipulation}.game{width:min(100%,520px)}.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin:auto;width:min(100%,420px)}.head div{min-width:0}.head .stat:first-child{text-align:right}.head .stat:last-of-type{text-align:left}.head-tools{display:flex;justify-content:center;gap:6px;margin-top:8px;grid-column:1/-1}.small-button{min-height:32px;padding:0 10px;border:1px solid #e0b0ff55;border-radius:9px;color:#fff;background:#2b1b43;font-weight:700;font-size:11px}.stage{display:grid;grid-template-columns:minmax(58px,78px) minmax(0,1fr) minmax(58px,78px);align-items:start;gap:8px;width:min(100%,420px);margin:10px auto}.side{width:100%;padding:7px 4px;overflow:hidden}.preview-wrap{display:grid;place-items:center;min-height:64px}.preview{width:64px;height:64px;max-width:100%;display:block}.hold-swap{animation:hold-swap .48s cubic-bezier(.2,.8,.2,1)}@keyframes hold-swap{0%{transform:translateY(8px) scale(.72);opacity:.35}45%{transform:translateY(-8px) scale(1.12);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}.board{width:min(62vw,220px,54dvh);justify-self:center;border-radius:4px}.pad{display:flex;flex-direction:column;gap:8px;width:min(100%,350px);margin:10px auto 0}.dpad{display:grid;grid-template-columns:repeat(3,minmax(52px,1fr));gap:6px;width:min(100%,220px);margin:auto}.dpad button,.actions button{min-height:44px;border:1px solid #e0b0ff55;border-radius:10px;color:#fff;background:#4c306b;font-size:17px;font-weight:700;touch-action:manipulation}.dpad button:nth-child(2){grid-column:2}.dpad button:nth-child(1){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:3;grid-row:2}.dpad button:nth-child(4){grid-column:2;grid-row:3}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.actions button{font-size:11px}.pad button:active,.small-button:active{transform:translateY(1px);filter:brightness(1.25)}.help{margin:8px 0 0}.binds-dialog{width:min(92vw,390px);max-height:86dvh;padding:0;border:1px solid #d99cff66;border-radius:16px;color:#f7f1ff;background:#170e22;box-shadow:0 22px 80px #000b}.binds-dialog::backdrop{background:#08040dcc;backdrop-filter:blur(3px)}.binds-shell{padding:18px}.binds-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.binds-head h2{margin:0;font-size:20px}.binds-close,.binds-reset{border:1px solid #e0b0ff55;border-radius:8px;color:#fff;background:#2b1b43;padding:7px 10px;font-weight:700}.binds-list{display:grid;gap:7px;margin:14px 0;max-height:52dvh;overflow:auto}.bind-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff12}.bind-row span{font-size:13px}.bind-key{min-width:92px;padding:7px 8px;border:1px solid #e0b0ff55;border-radius:8px;color:#fff;background:#4c306b;font:600 12px system-ui}.bind-help{margin:0 0 12px;color:#bbaaca;font-size:11px}@media(max-width:380px){body{padding-inline:4px}.stage{gap:4px}.side{padding-inline:2px}.preview{width:56px;height:56px}.board{width:min(63vw,205px,52dvh)}.actions button{font-size:10px}}
</style></head><body><main class="game"><div class="head"><div class="stat"><span>Pontos</span><b id="score">0</b></div><h1>Tetris</h1><div class="stat"><span>Linhas</span><b id="lines">0</b></div><div class="head-tools"><button class="small-button" id="binds" type="button">⌨ Binds</button></div></div><div class="stage"><aside class="side"><small>Hold</small><div class="preview-wrap" id="hold-wrap"><canvas class="preview" id="hold" width="80" height="80"></canvas></div></aside><canvas class="board" id="board" width="200" height="400"></canvas><aside class="side"><small>Próxima</small><div class="preview-wrap"><canvas class="preview" id="next" width="80" height="80"></canvas></div></aside></div><div class="pad"><div class="dpad"><button data-key="left" aria-label="Mover para esquerda">◀</button><button data-key="rotate" aria-label="Girar">↻</button><button data-key="right" aria-label="Mover para direita">▶</button><button data-key="down" aria-label="Descer">▼</button></div><div class="actions"><button data-key="drop">⤓ DROP</button><button data-key="rotateLeft">↺</button><button data-key="hold">HOLD</button><button data-key="restart">↻ RESET</button></div></div><p class="help" id="help">Setas: mover · ↑/X: girar · Espaço: queda · C/Shift: hold</p></main><dialog class="binds-dialog" id="binds-dialog"><div class="binds-shell"><div class="binds-head"><h2>Controles</h2><button class="binds-close" id="binds-close" type="button">Fechar</button></div><p class="bind-help">Toque em um valor e pressione a tecla desejada. As alterações ficam salvas neste dispositivo.</p><div class="binds-list" id="binds-list"></div><button class="binds-reset" id="binds-reset" type="button">Restaurar padrões</button></div></dialog>
<script>
"use strict";
const COLS=10,ROWS=20,HIDDEN=2,CELL=20,LOCK_DELAY=500,LOCK_RESETS=15;
const colors={I:"#29d8ed",J:"#4977f2",L:"#f39a32",O:"#f3d53c",S:"#55cf66",T:"#ad63dd",Z:"#ed4e62"};
const shapes={I:["....","IIII","....","...."],J:["J..","JJJ","..."],L:["..L","LLL","..."],O:[".OO.",".OO.","....","...."],S:[".SS","SS.","..."],T:[".T.","TTT","..."],Z:["ZZ.",".ZZ","..."]};
const jlKicks={"0>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"1>0":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"1>2":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"2>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"2>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]],"3>2":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"3>0":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"0>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]]};
const iKicks={"0>1":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"1>0":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"1>2":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],"2>1":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"2>3":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"3>2":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"3>0":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"0>3":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]]};
const boardCanvas=document.querySelector("#board"),ctx=boardCanvas.getContext("2d"),scoreEl=document.querySelector("#score"),linesEl=document.querySelector("#lines"),holdWrap=document.querySelector("#hold-wrap"),helpEl=document.querySelector("#help");
let board,piece,queue,bag,held,holdUsed,score,lines,level,lastFall,groundedAt,lockResets,over,raf,effects=[],hardDropFx=null,clearFx=null,audioContext=null,bindingAction=null;
const defaultBinds={left:"ArrowLeft",right:"ArrowRight",down:"ArrowDown",rotate:"ArrowUp",rotateLeft:"z",drop:" ",hold:"c",restart:"r"};
const bindLabels={left:"Mover para esquerda",right:"Mover para direita",down:"Descer",rotate:"Girar horário",rotateLeft:"Girar anti-horário",drop:"Queda instantânea",hold:"Hold",restart:"Reiniciar"};
let binds=loadBinds();
function loadBinds(){try{return {...defaultBinds,...JSON.parse(localStorage.getItem("organizeon-tetris-binds")||"{}")}}catch{return {...defaultBinds}}}
function saveBinds(){localStorage.setItem("organizeon-tetris-binds",JSON.stringify(binds));renderBinds()}
function displayKey(key){return key===" "?"Espaço":key.length===1?key.toUpperCase():key}
function matrix(rows){return rows.map(row=>[...row].map(v=>v==="."?null:v))}
function rotateMatrix(source,dir){const n=source.length,out=Array.from({length:n},()=>Array(n).fill(null));for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(dir>0)out[x][n-1-y]=source[y][x];else out[n-1-x][y]=source[y][x];return out}
function refill(){const values=Object.keys(shapes);for(let i=values.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}bag.push(...values)}
function take(){if(!bag.length)refill();return bag.shift()}
function ensureQueue(){while(queue.length<5)queue.push(take())}
function spawn(type=queue.shift()){ensureQueue();const m=matrix(shapes[type]);piece={type,m,rotation:0,x:Math.floor((COLS-m.length)/2),y:type==="I"?-1:-HIDDEN};holdUsed=false;groundedAt=null;lockResets=0;if(collides(piece.x,piece.y,piece.m)){over=true;playSound("over");draw()}}
function collides(px,py,m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const bx=px+x,by=py+y;if(bx<0||bx>=COLS||by>=ROWS+HIDDEN||by>=0&&board[by][bx])return true}return false}
function onGround(){return collides(piece.x,piece.y+1,piece.m)}
function resetLock(){if(onGround()&&lockResets<LOCK_RESETS){groundedAt=performance.now();lockResets++}else if(!onGround())groundedAt=null}
function move(dx,dy,manual=false){if(over)return false;if(!collides(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;if(manual&&dx)resetLock();if(manual&&dy>0)score++;return true}return false}
function rotate(dir){if(over||piece.type==="O")return false;const from=piece.rotation,to=(from+(dir>0?1:3))%4,next=rotateMatrix(piece.m,dir);const kicks=(piece.type==="I"?iKicks:jlKicks)[`${from}>${to}`]||[[0,0]];for(const [dx,dy] of kicks)if(!collides(piece.x+dx,piece.y-dy,next)){piece.x+=dx;piece.y-=dy;piece.m=next;piece.rotation=to;resetLock();return true}return false}
function hardDrop(){if(over)return;const target=ghostY();hardDropFx={at:performance.now(),x:piece.x*CELL+CELL/2,y:Math.max(0,(target-HIDDEN)*CELL)};playSound("drop");let distance=0;while(move(0,1))distance++;score+=distance*2;lock()}
function hold(){if(over||holdUsed)return false;const old=held;held=piece.type;if(old){const m=matrix(shapes[old]);piece={type:old,m,rotation:0,x:Math.floor((COLS-m.length)/2),y:old==="I"?-1:-HIDDEN};groundedAt=null;lockResets=0}else spawn();holdUsed=true;drawPreview("hold",held);holdWrap.classList.remove("hold-swap");void holdWrap.offsetWidth;holdWrap.classList.add("hold-swap");window.setTimeout(()=>holdWrap.classList.remove("hold-swap"),520);playSound("hold");return true}
function lock(){for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x]){const by=piece.y+y;if(by<0){over=true;playSound("over");draw();return}board[by][piece.x+x]=piece.type}let cleared=0;for(let y=board.length-1;y>=0;y--)if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(null));cleared++;y++}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=1+Math.floor(lines/10);triggerClearFx(cleared)}else playSound("lock");spawn();updateHud()}
function ghostY(){let y=piece.y;while(!collides(piece.x,y+1,piece.m))y++;return y}
function cell(x,y,type,alpha=1){if(y<HIDDEN)return;ctx.globalAlpha=alpha;ctx.fillStyle=colors[type];ctx.fillRect(x*CELL,(y-HIDDEN)*CELL,CELL,CELL);ctx.strokeStyle="#ffffff33";ctx.strokeRect(x*CELL+.5,(y-HIDDEN)*CELL+.5,CELL-1,CELL-1);ctx.globalAlpha=1}
function triggerClearFx(count){const at=performance.now();clearFx={at,count};playSound(count>=4?"tetris":"line");for(let i=0;i<count*12;i++)effects.push({at,x:Math.random()*200,y:80+Math.random()*280,vx:(Math.random()-.5)*2,vy:-Math.random()*2-1,life:500,color:"#f3d53c"})}
function drawEffects(now){effects=effects.filter(f=>now-f.at< f.life);for(const f of effects){const age=now-(f.at||now),p=Math.min(1,age/f.life);f.x+=f.vx;f.y+=f.vy;f.vy+=.08;ctx.globalAlpha=1-p;ctx.fillStyle=f.color;ctx.fillRect(f.x,f.y,2.5,2.5)}if(hardDropFx){const p=(now-hardDropFx.at)/320;if(p<1){const target=hardDropFx.y;ctx.save();ctx.globalCompositeOperation="screen";for(let i=0;i<4;i++){const x=hardDropFx.x+(i-2)*9+Math.sin(i*9+now/30)*3;ctx.strokeStyle=i===1?"#fff":"#b9edff";ctx.globalAlpha=(1-p)*(.45+i*.1);ctx.lineWidth=i===1?3:1.2;ctx.beginPath();ctx.moveTo(x,-20);ctx.lineTo(x+(Math.random()-.5)*12,target);ctx.stroke()}ctx.fillStyle="#ffffff";ctx.globalAlpha=(1-p)*.2;ctx.fillRect(0,target-12,200,24);ctx.restore()}else hardDropFx=null}if(clearFx){const p=(now-clearFx.at)/500;if(p<1){ctx.save();ctx.globalAlpha=(1-p)*.7;ctx.fillStyle="#fff";ctx.fillRect(0,0,200,400);ctx.globalAlpha=(1-p)*.8;ctx.fillStyle="#f3d53c";for(let y=0;y<ROWS;y++)ctx.fillRect(0,y*CELL,200,2);ctx.restore()}else clearFx=null}ctx.globalAlpha=1}
function draw(){ctx.fillStyle="#09060d";ctx.fillRect(0,0,200,400);ctx.strokeStyle="#ffffff09";for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,400);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(200,y*CELL);ctx.stroke()}for(let y=HIDDEN;y<board.length;y++)for(let x=0;x<COLS;x++)if(board[y][x])cell(x,y,board[y][x]);if(piece&&!over){const gy=ghostY();for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,gy+y,piece.type,.2);for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,piece.y+y,piece.type)}if(over){ctx.fillStyle="#09060dcc";ctx.fillRect(0,0,200,400);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 22px system-ui";ctx.fillText("GAME OVER",100,185);ctx.font="13px system-ui";ctx.fillText("Toque em Reiniciar",100,212)}drawEffects(performance.now());drawPreview("next",queue[0])}
function drawPreview(id,type){const c=document.querySelector(`#${id}`),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);if(!type)return;const m=matrix(shapes[type]),s=16,ox=(80-m.length*s)/2,oy=(80-m.length*s)/2;for(let y=0;y<m.length;y++)for(let z=0;z<m[y].length;z++)if(m[y][z]){x.fillStyle=colors[type];x.fillRect(ox+z*s,oy+y*s,s,s);x.strokeStyle="#ffffff44";x.strokeRect(ox+z*s+.5,oy+y*s+.5,s-1,s-1)}}
function updateHud(){scoreEl.textContent=score;linesEl.textContent=lines;localStorage.setItem("organizeon-tetris-progress",JSON.stringify({highScore:Math.max(score,Number(JSON.parse(localStorage.getItem("organizeon-tetris-progress")||"{}").highScore)||0),lastScore:score,lines}))}
function tick(now){if(!lastFall)lastFall=now;const gravity=Math.max(80,1000*Math.pow(.8,level-1));if(now-lastFall>=gravity){if(!move(0,1)&&groundedAt==null)groundedAt=now;lastFall=now}if(onGround()){if(groundedAt==null)groundedAt=now;if(now-groundedAt>=LOCK_DELAY)lock()}else groundedAt=null;draw();raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);board=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null));queue=[];bag=[];held=null;holdUsed=false;score=0;lines=0;level=1;lastFall=0;groundedAt=null;lockResets=0;over=false;effects=[];hardDropFx=null;clearFx=null;ensureQueue();spawn();drawPreview("hold",null);updateHud();playSound("start");raf=requestAnimationFrame(tick)}
function ensureAudio(){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}catch{audioContext=null}}
function playTone(freq,duration,type="sine",gain=.035,delay=0){if(!audioContext)return;const start=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(audioContext.destination);o.start(start);o.stop(start+duration+.02)}
function playSound(name){ensureAudio();if(name==="move")playTone(180,.045,"square",.018);else if(name==="rotate")playTone(420,.08,"triangle",.025);else if(name==="drop"){playTone(110,.12,"sawtooth",.035);playTone(230,.1,"triangle",.025,.045)}else if(name==="hold")playTone(320,.1,"sine",.03);else if(name==="line")playTone(560,.14,"triangle",.04);else if(name==="tetris"){playTone(520,.12,"triangle",.04);playTone(780,.18,"triangle",.04,.1)}else if(name==="lock")playTone(90,.045,"square",.012);else if(name==="over")playTone(140,.35,"sawtooth",.03);else if(name==="start")playTone(260,.06,"sine",.018)}
function action(name){if(name==="left"&&move(-1,0,true))playSound("move");else if(name==="right"&&move(1,0,true))playSound("move");else if(name==="down"&&move(0,1,true))playSound("move");else if(name==="rotate"&&rotate(1))playSound("rotate");else if(name==="rotateLeft"&&rotate(-1))playSound("rotate");else if(name==="drop")hardDrop();else if(name==="hold")hold();else if(name==="restart")restart();updateHud();draw()}
function renderBinds(){const list=document.querySelector("#binds-list");if(!list)return;list.replaceChildren();for(const name of Object.keys(bindLabels)){const row=document.createElement("div");row.className="bind-row";const label=document.createElement("span");label.textContent=bindLabels[name];const button=document.createElement("button");button.className="bind-key";button.type="button";button.textContent=bindingAction===name?"Pressione…":displayKey(binds[name]);button.onclick=()=>{bindingAction=name;renderBinds()};row.append(label,button);list.append(row)}helpEl.textContent=`Setas: mover · ${displayKey(binds.rotate)}/${displayKey(binds.rotateLeft)}: girar · ${displayKey(binds.drop)}: queda · ${displayKey(binds.hold)}: hold`}
document.addEventListener("keydown",event=>{ensureAudio();if(bindingAction){event.preventDefault();if(event.key==="Escape"){bindingAction=null;renderBinds();return}binds[bindingAction]=event.key;bindingAction=null;saveBinds();return}if(event.target.closest?.(".binds-dialog"))return;const name=Object.entries(binds).find(([,key])=>key===event.key)?.[0];if(!name)return;event.preventDefault();action(name)});
document.querySelectorAll("[data-key]").forEach(button=>button.addEventListener("pointerdown",event=>{event.preventDefault();ensureAudio();action(button.dataset.key)}));
document.querySelector("#binds").addEventListener("click",()=>{bindingAction=null;renderBinds();document.querySelector("#binds-dialog").showModal()});document.querySelector("#binds-close").addEventListener("click",()=>document.querySelector("#binds-dialog").close());document.querySelector("#binds-reset").addEventListener("click",()=>{binds={...defaultBinds};bindingAction=null;saveBinds()});renderBinds();restart();
</script></body></html>
