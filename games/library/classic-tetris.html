function settleBoard(now){const oldLast=lastPlacedCells.slice(),nextLast=[];for(let x=0;x<COLS;x++){const occupied=[];for(let y=board.length-1;y>=0;y--)if(board[y][x])occupied.push({fromY:y,type:board[y][x]});for(let y=0;y<board.length;y++)board[y][x]=null;occupied.forEach((entry,index)=>{const toY=board.length-1-index;board[toY][x]=entry.type;for(const cellInfo of oldLast)if(cellInfo.x===x&&cellInfo.y===entry.fromY&&cellInfo.type===entry.type)nextLast.push({...cellInfo,y:toY});if(toY!==entry.fromY){const px=x*CELL+CELL/2,py=(toY-HIDDEN)*CELL+CELL/2;for(let i=0;i<3;i++)effects.push({at:now,x:px+(Math.random()-.5)*12,y:py,vx:(Math.random()-.5)*1.4,vy:-1-Math.random()*2,gravity:.12,life:300+Math.random()*180,color:"#bbaaca",size:2+Math.floor(Math.random()*2)})}})}lastPlacedCells=nextLast;earthquakeFx.settled=true}
function drawAbilityCutscene(now){if(!cutscene)return;const age=now-cutscene.at;if(cutscene.kind==="lightning"){if(!lightningFx.removed&&age>=420)resolveLightning(lightningFx,now);const target=lightningFx.cells[0],tx=target.x*CELL+CELL/2,ty=(target.y-HIDDEN)*CELL+CELL/2;ctx.save();ctx.globalCompositeOperation="screen";ctx.strokeStyle=age<420?"#fff7a8":"#6b625a";ctx.lineWidth=age<420?3:1;ctx.globalAlpha=Math.max(0,1-age/700);ctx.beginPath();ctx.moveTo(tx+Math.sin(age/30)*4,0);ctx.lineTo(tx-8,Math.min(ty*.35,ty));ctx.lineTo(tx+6,Math.min(ty*.68,ty));ctx.lineTo(tx,ty);ctx.stroke();ctx.restore();if(age>=cutscene.duration){cutscene=null;lightningFx=null;lastFall=now;groundedAt=null}}else if(cutscene.kind==="earthquake"){if(!earthquakeFx.settled&&age>=2000)settleBoard(now);ctx.save();ctx.globalAlpha=Math.min(.25,Math.max(0,.08+Math.sin(age/45)*.06));ctx.fillStyle="#d8b45a";ctx.fillRect(0,0,200,400);ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="bold 13px system-ui";ctx.textAlign="center";ctx.fillText("TERREMOTO",100,28);ctx.restore();if(age>=cutscene.duration){cutscene=null;earthquakeFx=null;lastFall=now;groundedAt=null}}}

function cell(x,y,type,alpha=1){if(y<HIDDEN)return;let sx=x*CELL,sy=(y-HIDDEN)*CELL;const isDroppedPiece=hardDropFx?.lockedCells?.some(([cx,cy])=>cx===x&&cy===y);if(hardDropFx?.impactAt&&!isDroppedPiece){const elapsed=performance.now()-hardDropFx.impactAt,dx=sx+CELL/2-hardDropFx.impactX,dy=sy+CELL/2-hardDropFx.impactY,distance=Math.hypot(dx,dy),waveRadius=Math.min(180,elapsed*.58),waveWidth=22,wave=Math.max(0,1-Math.abs(distance-waveRadius)/waveWidth)*Math.max(0,1-elapsed/430);if(wave){const jitter=wave*(5.2+Math.sin(elapsed/10)*1.8);sx+=Math.sin(elapsed/15+x*17+y*31)*jitter;sy+=Math.cos(elapsed/13+x*23+y*11)*jitter}}if(earthquakeFx&&!earthquakeFx.settled){const elapsed=performance.now()-earthquakeFx.at;if(elapsed<2000){const intensity=2.4+Math.sin(elapsed/70)*.8;sx+=Math.sin(elapsed/18+x*1.7+y)*intensity;sy+=Math.cos(elapsed/21+y*1.9+x)*intensity}}const toasted=lightningFx&&!lightningFx.removed&&lightningFx.cellKeys.has(x+","+y);ctx.globalAlpha=alpha;ctx.fillStyle=toasted?"#111":colors[type];ctx.fillRect(sx,sy,CELL,CELL);ctx.strokeStyle=toasted?"#000":"#ffffff33";ctx.strokeRect(sx+.5,sy+.5,CELL-1,CELL-1);if(toasted){ctx.globalAlpha=alpha*.75;ctx.fillStyle="#49342a";ctx.fillRect(sx+3,sy+3,CELL-6,3)}ctx.globalAlpha=1}
function triggerClearFx(rows){const at=performance.now(),rowYs=rows.map(row=>Math.max(0,Math.min(ROWS-1,row)));clearFx={at,rowYs,bursts:Array.from({length:Math.max(20,rowYs.length*18)},(_,index)=>{const rowY=rowYs[index%rowYs.length],y=rowY*CELL+CELL/2;return{x:100+(Math.random()-.5)*100,y,angle:Math.random()*Math.PI*2,speed:25+Math.random()*90,size:2+Math.random()*4,color:["#fff","#f3d53c","#ff8b3d","#ff4f91"][Math.floor(Math.random()*4)]}})};playSound(rowYs.length>=4?"tetris":"line");for(const burst of clearFx.bursts)effects.push({at,x:burst.x,y:burst.y,vx:Math.cos(burst.angle)*burst.speed/18,vy:Math.sin(burst.angle)*burst.speed/18,life:520,color:burst.color,size:burst.size,gravity:.04})}
function colorVariant(type,amount){const hex=colors[type].slice(1),r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16),mix=amount>=0?255:0,ratio=Math.min(1,Math.abs(amount));return `rgb(${Math.round(r+(mix-r)*ratio)},${Math.round(g+(mix-g)*ratio)},${Math.round(b+(mix-b)*ratio)})`}
function drawFxPiece(f,y,alpha,scale=1,rotation=0,shine=0,phase=0){if(f.at)drawSkyBeam(f,performance.now(),Math.min(1,(performance.now()-f.at)/f.duration));ctx.save();ctx.globalAlpha=alpha;ctx.translate(f.x+(f.width*CELL)/2,y+(f.height*CELL)/2);ctx.rotate(rotation);ctx.scale(scale,scale);if(shine)ctx.shadowBlur=10*shine;for(let row=0;row<f.m.length;row++)for(let col=0;col<f.m[row].length;col++)if(f.m[row][col]){const px=(col-f.width/2)*CELL,py=(row-f.height/2)*CELL,variant=shine?colorVariant(f.type,.2+.22*Math.sin(phase+row*.8+col*.55)):colors[f.type];ctx.fillStyle=variant;if(shine)ctx.shadowColor=variant;ctx.fillRect(px,py,CELL,CELL);ctx.strokeStyle="rgba(5,3,9,.7)";ctx.lineWidth=2;ctx.strokeRect(px+1,py+1,CELL-2,CELL-2);ctx.fillStyle=shine?colorVariant(f.type,.7):"#ffffff55";ctx.fillRect(px+2,py+2,CELL-4,3)}ctx.restore()}
function startDropImpact(f,now){f.impactAt=now;f.impactX=f.x+f.width*CELL/2;f.impactY=f.endY+f.height*CELL;f.sparks.forEach(spark=>{spark.x=f.impactX;spark.y=f.impactY});const palette=[colors[f.type],"#fff","#b9edff"];for(let i=0;i<26;i++){const angle=Math.random()*Math.PI,speed=18+Math.random()*62;effects.push({at:now,x:f.impactX+(Math.random()-.5)*18,y:f.impactY+(Math.random()-.5)*4,vx:Math.cos(angle)*speed/18,vy:-Math.abs(Math.sin(angle))*speed/18-.5,life:260+Math.random()*180,color:palette[i%palette.length],size:2+Math.floor(Math.random()*3),gravity:.12})}}
function drawDropImpact(f,now){const impact=Math.min(1,(now-f.impactAt)/360),easeOut=1-Math.pow(1-impact,3);ctx.save();ctx.globalCompositeOperation="screen";for(let i=0;i<18;i++){const spark=f.sparks[i%f.sparks.length],distance=spark.speed*easeOut,sx=f.impactX+Math.cos(spark.angle)*distance,sy=f.impactY+Math.sin(spark.angle)*distance;ctx.globalAlpha=(1-impact)*.9;ctx.fillStyle=i%3===0?"#fff":colors[f.type];ctx.fillRect(Math.round(sx/2)*2,Math.round(sy/2)*2,3,3)}for(let i=0;i<12;i++){const x=f.impactX-48+i*8,y=f.impactY+Math.sin(i*2.4)*4;ctx.globalAlpha=(1-impact)*.6;ctx.fillStyle="#f3d53c";ctx.fillRect(x,y,5,3)}ctx.restore();return impact}
function drawDropFx(now){if(!hardDropFx)return;const f=hardDropFx,elapsed=now-f.at,fall=Math.min(1,elapsed/f.duration),ease=1-Math.pow(1-fall,3);if(!f.impactAt&&elapsed>=Math.max(0,f.duration-f.impactLead))startDropImpact(f,now);if(fall<1){const y=f.startY+(f.endY-f.startY)*ease;drawFxPiece(f,y,1,1,0);if(f.impactAt)drawDropImpact(f,now);return}const impactProgress=drawDropImpact(f,now),shineAge=now-(f.at+f.duration);if(shineAge>=0&&shineAge<800){const fade=1-shineAge/800;drawFxPiece(f,f.endY,fade,1,0,fade,shineAge/90)}if(impactProgress>=1&&shineAge>=800)hardDropFx=null}
function drawEffects(now){effects=effects.filter(f=>now-f.at<f.life);for(const f of effects){const age=now-(f.at||now),p=Math.min(1,age/f.life);f.x+=f.vx;f.y+=f.vy;f.vy+=f.gravity??.08;f.vx*=.995;ctx.globalAlpha=1-p;ctx.fillStyle=f.color;const size=Math.max(2,Math.round(f.size||2.5));ctx.fillRect(Math.round((f.x-size/2)/2)*2,Math.round((f.y-size/2)/2)*2,size,size)}drawDropFx(now);if(clearFx){const p=Math.min(1,(now-clearFx.at)/560),ease=1-Math.pow(1-p,3);if(p<1){ctx.save();ctx.globalCompositeOperation="screen";for(const rowY of clearFx.rowYs)for(let i=0;i<20;i++){const angle=i/20*Math.PI*2,radius=8+ease*76,sx=100+Math.cos(angle)*radius,sy=rowY*CELL+CELL/2+Math.sin(angle)*Math.min(12,ease*18);ctx.globalAlpha=(1-p)*.75;ctx.fillStyle=i%3===0?"#fff":"#f3d53c";ctx.fillRect(Math.round(sx/2)*2,Math.round(sy/2)*2,4,4)}ctx.restore()}else clearFx=null}drawAbilityCutscene(now);ctx.globalAlpha=1}
function draw(){ctx.fillStyle="#09060d";ctx.fillRect(0,0,200,400);ctx.strokeStyle="#ffffff09";for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,400);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(200,y*CELL);ctx.stroke()}for(let y=HIDDEN;y<board.length;y++)for(let x=0;x<COLS;x++)if(board[y][x])cell(x,y,board[y][x]);if(piece&&!over){const gy=ghostY();for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,gy+y,piece.type,.2);for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,piece.y+y,piece.type)}if(over){ctx.fillStyle="#09060dcc";ctx.fillRect(0,0,200,400);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 22px system-ui";ctx.fillText("GAME OVER",100,185);ctx.font="13px system-ui";ctx.fillText("Toque em Reiniciar",100,212)}drawEffects(performance.now());drawPreview("next",queue[0])}
function drawPreview(id,type){const c=document.querySelector(`#${id}`),x=c.getContext("2d");c.classList.toggle("hold-idle",id==="hold"&&Boolean(type));x.clearRect(0,0,c.width,c.height);if(!type)return;const m=matrix(shapes[type]),s=16,ox=(80-m.length*s)/2,oy=(80-m.length*s)/2;for(let y=0;y<m.length;y++)for(let z=0;z<m[y].length;z++)if(m[y][z]){x.fillStyle=colors[type];x.fillRect(ox+z*s,oy+y*s,s,s);x.strokeStyle="#ffffff44";x.strokeRect(ox+z*s+.5,oy+y*s+.5,s-1,s-1)}}
function cloudBackupBridge(){for(const root of [window,window.parent,window.top]){try{if(root?.organizeonCloudBackup)return root.organizeonCloudBackup}catch{}}return null}
function refreshCloudHighscoreStatus(){if(!cloudHighScoreEl)return;const bridge=cloudBackupBridge();cloudHighScoreEl.style.color=bridge?.enabled?"#73e6a1":"#bbaaca";cloudHighScoreEl.textContent=bridge?.enabled?"☁ Highscore salvo na nuvem":"☁ Highscore salvo localmente"}
async function syncHighscoreCloud(){const bridge=cloudBackupBridge();if(!bridge?.enabled){refreshCloudHighscoreStatus();return}cloudHighScoreEl.style.color="#f3d53c";cloudHighScoreEl.textContent="☁ Salvando highscore…";try{await bridge.save();cloudHighScoreEl.style.color="#73e6a1";cloudHighScoreEl.textContent="☁ Highscore salvo na nuvem"}catch{cloudHighScoreEl.style.color="#ff8b9e";cloudHighScoreEl.textContent="☁ Falha ao salvar highscore"}}
function updateHud(){scoreEl.textContent=score;linesEl.textContent=lines;lightningCountEl.textContent=lightningCharges;earthquakeCountEl.textContent=earthquakeCharges;const previous=JSON.parse(localStorage.getItem("organizeon-tetris-progress")||"{}"),highScore=Math.max(score,Number(previous.highScore)||0);highScoreEl.textContent=highScore;localStorage.setItem("organizeon-tetris-progress",JSON.stringify({highScore,lastScore:score,lines}));if(highScore>Number(previous.highScore)||0)syncHighscoreCloud();else refreshCloudHighscoreStatus()}
function tick(now){if(!lastFall)lastFall=now;if(cutscene){draw();raf=requestAnimationFrame(tick);return}const gravity=Math.min(2200,1000+lines*25);if(now-lastFall>=gravity){if(!move(0,1)&&groundedAt==null)groundedAt=now;lastFall=now}if(onGround()){if(groundedAt==null)groundedAt=now;if(now-groundedAt>=LOCK_DELAY)lock()}else groundedAt=null;draw();raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);board=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null));queue=[];bag=[];held=null;holdUsed=false;score=0;lines=0;level=1;lastFall=0;groundedAt=null;lockResets=0;over=false;effects=[];hardDropFx=null;clearFx=null;cutscene=null;lightningFx=null;earthquakeFx=null;lastPlacedCells=[];lightningCharges=0;earthquakeCharges=0;lightningAwarded=0;earthquakeAwarded=0;ensureQueue();spawn();drawPreview("hold",null);updateHud();playSound("start");raf=requestAnimationFrame(tick)}
function ensureAudio(){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}catch{audioContext=null}}
function playNoise(duration=.08,gain=.02,delay=0){if(!audioContext)return;const count=Math.max(1,Math.floor(audioContext.sampleRate*duration)),buffer=audioContext.createBuffer(1,count,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<count;i++){const envelope=1-i/count;data[i]=(Math.random()*2-1)*envelope}const source=audioContext.createBufferSource(),amp=audioContext.createGain(),start=audioContext.currentTime+delay;amp.gain.setValueAtTime(gain,start);amp.gain.exponentialRampToValueAtTime(.0001,start+duration);source.buffer=buffer;source.connect(amp).connect(audioContext.destination);source.start(start);source.stop(start+duration+.01)}
function playTone(freq,duration,type="sine",gain=.035,delay=0){if(!audioContext)return;const start=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(audioContext.destination);o.start(start);o.stop(start+duration+.02)}
function playSound(name){ensureAudio();if(name==="move")playTone(180,.045,"square",.018);else if(name==="rotate")playTone(420,.08,"square",.025);else if(name==="drop"){playTone(880,.045,"square",.035);playTone(520,.075,"square",.03,.035);playTone(180,.16,"square",.05,.08);playNoise(.11,.018,.015)}else if(name==="hold"){playTone(320,.06,"square",.03);playTone(640,.08,"square",.025,.06)}else if(name==="fill"){playTone(180,.08,"square",.05);playTone(90,.18,"square",.055,.045);playNoise(.2,.06,.02);playTone(740,.12,"square",.04,.1)}else if(name==="line"){playTone(660,.08,"square",.035);playTone(880,.12,"square",.04,.07);playNoise(.07,.012,.02)}else if(name==="tetris"){playTone(520,.08,"square",.04);playTone(660,.08,"square",.04,.08);playTone(880,.16,"square",.045,.16)}else if(name==="lock")playTone(90,.045,"square",.012);else if(name==="over")playTone(140,.35,"square",.03);else if(name==="start")playTone(260,.06,"square",.018)}
function action(name){if(name==="left"&&move(-1,0,true))playSound("move");else if(name==="right"&&move(1,0,true))playSound("move");else if(name==="down"&&move(0,1,true))playSound("move");else if(name==="rotate"&&rotate(1))playSound("rotate");else if(name==="rotateLeft"&&rotate(-1))playSound("rotate");else if(name==="drop")hardDrop();else if(name==="hold")hold();else if(name==="restart")restart();else if(name==="lightning")useLightning();else if(name==="earthquake")useEarthquake();updateHud();draw()}
function renderBinds(){const list=document.querySelector("#binds-list");if(!list)return;list.replaceChildren();for(const name of Object.keys(bindLabels)){const row=document.createElement("div");row.className="bind-row";const label=document.createElement("span");label.textContent=bindLabels[name];const button=document.createElement("button");button.className="bind-key";button.type="button";button.textContent=bindingAction===name?"Pressione…":displayKey(binds[name]);button.onclick=()=>{bindingAction=name;renderBinds()};row.append(label,button);list.append(row)}helpEl.textContent=`Setas: mover · ${displayKey(binds.rotate)}/${displayKey(binds.rotateLeft)}: girar · ${displayKey(binds.drop)}: queda · ${displayKey(binds.hold)}: hold · ${displayKey(binds.lightning)}: raio · ${displayKey(binds.earthquake)}: terremoto`}
document.addEventListener("keydown",event=>{ensureAudio();if(bindingAction){event.preventDefault();if(event.key==="Escape"){bindingAction=null;renderBinds();return}binds[bindingAction]=event.key;bindingAction=null;saveBinds();return}if(event.target.closest?.(".binds-dialog"))return;const name=Object.entries(binds).find(([,key])=>key===event.key)?.[0];if(!name)return;event.preventDefault();action(name)});
document.querySelectorAll("[data-key]").forEach(button=>button.addEventListener("pointerdown",event=>{event.preventDefault();ensureAudio();action(button.dataset.key)}));
document.querySelector("#binds").addEventListener("click",()=>{bindingAction=null;renderBinds();document.querySelector("#binds-dialog").showModal()});document.querySelector("#binds-close").addEventListener("click",()=>document.querySelector("#binds-dialog").close());document.querySelector("#binds-reset").addEventListener("click",()=>{binds={...defaultBinds};bindingAction=null;saveBinds()});window.addEventListener("storage",event=>{if(event.key==="organizeon-tetris-left-handed")applyLayout()});window.addEventListener("message",event=>{if(event.data?.type==="organizeon-tetris-settings"){if(typeof event.data.leftHanded==="boolean"){localStorage.setItem("organizeon-tetris-left-handed",event.data.leftHanded?"1":"0");applyLayout()}}});applyLayout();renderBinds();restart();
</script></body></html>
