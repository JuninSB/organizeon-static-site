<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tetris</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#f7f1ff;background:radial-gradient(circle at 50% 5%,#513078,#100a19 72%);font-family:system-ui,sans-serif;touch-action:none;user-select:none}.game{width:min(96vw,520px);text-align:center}.head{display:flex;justify-content:center;align-items:end;gap:20px}.head div{min-width:80px}.head span{display:block;color:#cbb8db;font-size:11px;text-transform:uppercase}.head b{font-size:18px}h1{margin:0;font-size:clamp(28px,8vw,44px)}.stage{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:8px auto}.side{width:76px;padding:7px;border:1px solid #d99cff38;border-radius:10px;background:#170e22}.side small{display:block;margin-bottom:4px;color:#cbb8db}canvas{image-rendering:pixelated}.board{width:min(48vw,200px,50dvh);height:auto;border:2px solid #d99cff66;box-shadow:0 18px 55px #0009;background:#09060d}.preview{width:60px;height:60px}.pad{display:grid;grid-template-columns:repeat(5,minmax(48px,64px));gap:6px;justify-content:center}.pad button{height:45px;border:1px solid #e0b0ff55;border-radius:10px;color:#fff;background:#4c306b;font-size:17px;font-weight:700}.pad .wide{grid-column:span 2;font-size:12px}.help{margin:7px 0 0;color:#bbaaca;font-size:11px}@media(max-width:430px){.side{width:64px}.preview{width:50px;height:50px}.stage{gap:5px}.pad{grid-template-columns:repeat(5,minmax(43px,58px))}}
</style></head><body><main class="game"><div class="head"><div><span>Pontos</span><b id="score">0</b></div><h1>Tetris</h1><div><span>Linhas</span><b id="lines">0</b></div></div><div class="stage"><aside class="side"><small>Hold</small><canvas class="preview" id="hold" width="80" height="80"></canvas></aside><canvas class="board" id="board" width="200" height="400"></canvas><aside class="side"><small>Próxima</small><canvas class="preview" id="next" width="80" height="80"></canvas></aside></div><div class="pad"><button data-key="left">◀</button><button data-key="rotate">↻</button><button data-key="down">▼</button><button data-key="right">▶</button><button data-key="drop">⤓</button><button class="wide" data-key="hold">HOLD</button><button class="wide" data-key="restart">REINICIAR</button></div><p class="help">Setas: mover · Z/X: girar · Espaço: queda · C/Shift: hold</p></main>
<script>
"use strict";
const COLS=10,ROWS=20,HIDDEN=2,CELL=20,LOCK_DELAY=500,LOCK_RESETS=15;
const colors={I:"#29d8ed",J:"#4977f2",L:"#f39a32",O:"#f3d53c",S:"#55cf66",T:"#ad63dd",Z:"#ed4e62"};
const shapes={
 I:["....","IIII","....","...."],J:["J..","JJJ","..."],L:["..L","LLL","..."],
 O:[".OO.",".OO.","....","...."],S:[".SS","SS.","..."],T:[".T.","TTT","..."],Z:["ZZ.",".ZZ","..."]
};
const jlKicks={"0>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"1>0":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"1>2":[[0,0],[1,0],[1,1],[0,-2],[1,-2]],"2>1":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],"2>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]],"3>2":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"3>0":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],"0>3":[[0,0],[1,0],[1,-1],[0,2],[1,2]]};
const iKicks={"0>1":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"1>0":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"1>2":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],"2>1":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"2>3":[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],"3>2":[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],"3>0":[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],"0>3":[[0,0],[-1,0],[2,0],[-1,-2],[2,1]]};
const boardCanvas=document.querySelector("#board"),ctx=boardCanvas.getContext("2d"),scoreEl=document.querySelector("#score"),linesEl=document.querySelector("#lines");
let board,piece,queue,bag,held,holdUsed,score,lines,level,lastFall,groundedAt,lockResets,over,raf;
function matrix(rows){return rows.map(row=>[...row].map(v=>v==="."?null:v))}
function rotateMatrix(source,dir){const n=source.length,out=Array.from({length:n},()=>Array(n).fill(null));for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(dir>0)out[x][n-1-y]=source[y][x];else out[n-1-x][y]=source[y][x];return out}
function refill(){const values=Object.keys(shapes);for(let i=values.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}bag.push(...values)}
function take(){if(!bag.length)refill();return bag.shift()}
function ensureQueue(){while(queue.length<5)queue.push(take())}
function spawn(type=queue.shift()){ensureQueue();const m=matrix(shapes[type]);piece={type,m,rotation:0,x:Math.floor((COLS-m.length)/2),y:type==="I"?-1:-HIDDEN};holdUsed=false;groundedAt=null;lockResets=0;if(collides(piece.x,piece.y,piece.m)){over=true;draw();}}
function collides(px,py,m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const bx=px+x,by=py+y;if(bx<0||bx>=COLS||by>=ROWS+HIDDEN||by>=0&&board[by][bx])return true}return false}
function onGround(){return collides(piece.x,piece.y+1,piece.m)}
function resetLock(){if(onGround()&&lockResets<LOCK_RESETS){groundedAt=performance.now();lockResets++}else if(!onGround())groundedAt=null}
function move(dx,dy,manual=false){if(over)return false;if(!collides(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;if(manual&&dx)resetLock();if(manual&&dy>0)score++;return true}return false}
function rotate(dir){if(over||piece.type==="O")return;const from=piece.rotation,to=(from+(dir>0?1:3))%4,next=rotateMatrix(piece.m,dir);const kicks=(piece.type==="I"?iKicks:jlKicks)[`${from}>${to}`]||[[0,0]];for(const [dx,dy] of kicks){if(!collides(piece.x+dx,piece.y-dy,next)){piece.x+=dx;piece.y-=dy;piece.m=next;piece.rotation=to;resetLock();return}}}
function hardDrop(){if(over)return;let distance=0;while(move(0,1)){distance++}score+=distance*2;lock()}
function hold(){if(over||holdUsed)return;const old=held;held=piece.type;if(old){const m=matrix(shapes[old]);piece={type:old,m,rotation:0,x:Math.floor((COLS-m.length)/2),y:old==="I"?-1:-HIDDEN};groundedAt=null;lockResets=0}else spawn();holdUsed=true;drawPreview("hold",held)}
function lock(){for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x]){const by=piece.y+y;if(by<0){over=true;draw();return}board[by][piece.x+x]=piece.type}let cleared=0;for(let y=board.length-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(null));cleared++;y++}}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=1+Math.floor(lines/10)}spawn();updateHud()}
function ghostY(){let y=piece.y;while(!collides(piece.x,y+1,piece.m))y++;return y}
function cell(x,y,type,alpha=1){if(y<HIDDEN)return;ctx.globalAlpha=alpha;ctx.fillStyle=colors[type];ctx.fillRect(x*CELL,(y-HIDDEN)*CELL,CELL,CELL);ctx.strokeStyle="#ffffff33";ctx.strokeRect(x*CELL+.5,(y-HIDDEN)*CELL+.5,CELL-1,CELL-1);ctx.globalAlpha=1}
function draw(){ctx.fillStyle="#09060d";ctx.fillRect(0,0,200,400);ctx.strokeStyle="#ffffff09";for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,400);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(200,y*CELL);ctx.stroke()}for(let y=HIDDEN;y<board.length;y++)for(let x=0;x<COLS;x++)if(board[y][x])cell(x,y,board[y][x]);if(piece&&!over){const gy=ghostY();for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,gy+y,piece.type,.2);for(let y=0;y<piece.m.length;y++)for(let x=0;x<piece.m[y].length;x++)if(piece.m[y][x])cell(piece.x+x,piece.y+y,piece.type)}if(over){ctx.fillStyle="#09060dcc";ctx.fillRect(0,0,200,400);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 22px system-ui";ctx.fillText("GAME OVER",100,185);ctx.font="13px system-ui";ctx.fillText("Toque em Reiniciar",100,212)}drawPreview("next",queue[0])}
function drawPreview(id,type){const c=document.querySelector(`#${id}`),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);if(!type)return;const m=matrix(shapes[type]),s=16,ox=(80-m.length*s)/2,oy=(80-m.length*s)/2;for(let y=0;y<m.length;y++)for(let z=0;z<m[y].length;z++)if(m[y][z]){x.fillStyle=colors[type];x.fillRect(ox+z*s,oy+y*s,s,s);x.strokeStyle="#ffffff44";x.strokeRect(ox+z*s+.5,oy+y*s+.5,s-1,s-1)}}
function updateHud(){scoreEl.textContent=score;linesEl.textContent=lines;localStorage.setItem("organizeon-tetris-progress",JSON.stringify({highScore:Math.max(score,Number(JSON.parse(localStorage.getItem("organizeon-tetris-progress")||"{}").highScore)||0),lastScore:score,lines}))}
function tick(now){if(!lastFall)lastFall=now;const gravity=Math.max(80,1000*Math.pow(.8,level-1));if(now-lastFall>=gravity){if(!move(0,1)&&groundedAt==null)groundedAt=now;lastFall=now}if(onGround()){if(groundedAt==null)groundedAt=now;if(now-groundedAt>=LOCK_DELAY)lock()}else groundedAt=null;draw();raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);board=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null));queue=[];bag=[];held=null;holdUsed=false;score=0;lines=0;level=1;lastFall=0;groundedAt=null;lockResets=0;over=false;ensureQueue();spawn();drawPreview("hold",null);updateHud();raf=requestAnimationFrame(tick)}
function action(name){if(name==="left")move(-1,0,true);else if(name==="right")move(1,0,true);else if(name==="down")move(0,1,true);else if(name==="rotate")rotate(1);else if(name==="drop")hardDrop();else if(name==="hold")hold();else if(name==="restart")restart();updateHud();draw()}
document.addEventListener("keydown",event=>{const map={ArrowLeft:"left",ArrowRight:"right",ArrowDown:"down",ArrowUp:"rotate",x:"rotate",X:"rotate"," ":"drop",c:"hold",C:"hold",Shift:"hold",z:"rotateLeft",Z:"rotateLeft",r:"restart",R:"restart"};const name=map[event.key];if(!name)return;event.preventDefault();if(name==="rotateLeft")rotate(-1);else action(name);draw()});
document.querySelectorAll("[data-key]").forEach(button=>button.addEventListener("pointerdown",event=>{event.preventDefault();action(button.dataset.key)}));restart();
</script></body></html>
