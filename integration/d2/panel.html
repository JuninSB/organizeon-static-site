</style></head><body><main><header class="brand"><div class="mark">O</div><div><h1>OrganizeOn</h1><small>Painel de arquivos</small></div></header><section id="login" class="card login"><h2>Entrar</h2><p class="muted">Gerencie seus arquivos e hospede scripts.</p><input id="user" placeholder="Usuário" autocomplete="username"><input id="pass" type="password" placeholder="Senha" autocomplete="current-password"><button id="loginBtn" onclick="login()">Entrar</button><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="card"><div class="hrow"><div><b id="who"></b><div class="muted">Seus arquivos ficam organizados aqui.</div></div><button class="secondary" onclick="logout()">Sair</button></div></div><section class="card"><h2>Adicionar arquivo</h2><div class="actions"><label><input id="upload" type="file"></label><button onclick="uploadFile()">Enviar arquivo</button><button class="secondary" onclick="openText()">Novo texto</button></div><p id="msg" class="msg"></p><div id="uploadProgress" class="upload-progress" role="progressbar" aria-label="Progresso do upload" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="uploadProgressBar"></span></div><p id="uploadProgressText" class="muted" aria-live="polite"></p></section><section class="card"><div class="hrow"><h2>Meus arquivos</h2><button class="secondary" onclick="refresh()">Atualizar</button></div><div id="files"><p class="muted">Carregando...</p></div></section><section id="editorCard" class="card hidden"><div class="hrow"><h2 id="editorTitle">Novo texto</h2><button class="secondary" onclick="closeEditor()">Fechar</button></div><input id="textName" placeholder="Nome do arquivo (ex.: script.txt)"><textarea id="editor" placeholder="Cole ou escreva seu código aqui..."></textarea><button onclick="saveText()">Salvar texto</button><p id="editorMsg" class="msg"></p></section></section></main><script>
const API='https://api.organizeon.com.br/827e7h3heuw823eh';const MAX_UPLOAD_SIZE=100*1024*1024;let token=localStorage.getItem('organizeon_panel_token'),editing=null,canUploadLarge=false;const $=x=>document.getElementById(x);async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,opt);if(r.status===401){logout();throw Error('Sessão expirada')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'erro');return d}async function login(){const m=$('loginMsg');m.textContent='Entrando...';try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'credenciais inválidas');token=d.token;localStorage.setItem('organizeon_panel_token',token);m.textContent='Login realizado.';await showApp()}catch(e){m.textContent='Erro: '+e.message}}async function showApp(){try{const s=await api('/auth/session');$('who').textContent='Usuário: '+s.username;canUploadLarge=s.role==='ultra_admin'||s.role==='owner';$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('loginMsg').textContent='Erro: '+e.message}}function logout(){token=null;localStorage.removeItem('organizeon_panel_token');$('app').classList.add('hidden');$('login').classList.remove('hidden')}function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function refresh(){const d=await api('/files');$('files').innerHTML=d.files.length?d.files.map(f=>`<div class="file"><div><b>${esc(f.name)}</b><span class="meta">${fmt(f.size)} · ${new Date(f.updatedAt).toLocaleString()}</span></div><div class="tools">${f.contentType.startsWith('text/')?`<button class="secondary" onc window.D2PageFailure = (section, error, retry) => {

  section.classList.remove('enhanced');
  const page = document.createElement('section');
  page.dataset.pageError = 'true';
  page.style.cssText = 'position:fixed;inset:0;z-index:1001;overflow:auto;display:grid;place-content:center;gap:16px;padding:24px;background:#09090b;color:#fafafa;font:14px system-ui';
  const face = document.createElement('div'); face.textContent = ":'("; face.style.cssText = 'font-size:40px;color:#a1a1aa';
  const title = document.createElement('h2'); title.textContent = 'Um erro ocorreu ao carregar esta página!';
  const pre = document.createElement('pre'); pre.textContent = details; pre.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;max-width:680px;max-height:40vh;overflow:auto;padding:16px;background:#18181b;border:1px solid #27272a;border-radius:8px';
  const actions = document.createElement('div'); actions.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap';
  const copy = document.createElement('button'); copy.textContent = 'Copiar erro'; copy.style.cssText = 'background:#fafafa;color:#09090b';
  copy.onclick = async () => { try { await navigator.clipboard.writeText(details); copy.textContent = 'Erro copiado'; } catch { copy.textContent = 'Selecione o erro para copiar'; } };
  const reload = document.createElement('button'); reload.textContent = 'Tentar novamente'; reload.className = 'secondary'; reload.onclick = retry || (() => location.reload());
  actions.append(copy, reload); page.append(face, title, pre, actions);
  section.querySelector('[data-page-error]')?.remove(); section.append(page);
};

const uiOrigin = "https://juninsb.github.io/organizeon-static-site/ui-dist/";
(async () => {
  const host = document.createElement("div"); host.id = "d2-login-ui";
  const section = document.getElementById("login"); section.appendChild(host);
  let finished = false;
  const fallback = (error = new Error("Tempo limite ao carregar o módulo de login.")) => { if (finished) return; finished = true; host.remove(); D2PageFailure(section, error); };
  const timeout = setTimeout(fallback, 12000);
  try {
    const module = await import(uiOrigin + "client-ui.js?v=shared-ui-5873a21-release");
    if (finished) return;
    const cleanup = module.mountD2Login(host, async (username, password) => {
      document.getElementById("user").value = username;
      document.getElementById("pass").value = password;
      await login();
      document.getElementById("pass").value = "";
      if (!section.classList.contains("hidden")) throw new Error(document.getElementById("loginMsg").textContent.replace(/^Erro:\s*/, "") || "Não foi possível entrar.");
    }, uiOrigin + "client-ui.css?v=shared-ui-5873a21-release");

    const revealLogin = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      host.style.visibility = "visible";
      section.classList.add("enhanced");
      
    };
    const failLoginStyles = () => { cleanup(); clearTimeout(timeout); fallback(new Error("Não foi possível carregar os estilos do login.")); };

  } catch (error) { clearTimeout(timeout); fallback(error); console.error("Falha ao carregar tela de login.", error); }

</script><script type="module">

</script>
